name: Release candidate (manual)

# Phase 41 — the heavyweight local-only harnesses that are deliberately NOT
# part of the per-push `ci` workflow (each takes minutes and asserts
# end-to-end behaviour rather than a unit contract): the release-candidate
# simulation (docs/release-candidate-simulation.md), the performance suite
# (docs/performance-and-capacity.md) and the backup/restore drill.
#
# Manual trigger only. Entirely self-contained: every database is an
# ephemeral embedded-postgres instance the scripts create and destroy
# themselves, every EVM RPC call goes to the simulation's own local fake
# node, every other chain RPC points at a closed local port. No AWS, no
# cloud credentials, no secrets, no provider accounts — and it deploys
# nothing. A green run certifies the code, never any live environment.

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Clean-room RC simulation runs"
        required: false
        default: "2"
      include_perf:
        description: "Also run the performance suite"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      # The RC simulation runs the COMPILED api/worker (dist/), exactly as
      # the container images do.
      - name: Build
        run: npm run build

      - name: Release-candidate simulation
        run: npm run rc:simulate -w apps/api -- --runs "${{ github.event.inputs.runs }}"

      - name: Backup/restore drill
        run: npm run backup:drill -w apps/api

      - name: Performance suite
        if: ${{ github.event.inputs.include_perf == 'true' }}
        run: npm run perf -w apps/api

      - name: Production readiness report (informational — external gates stay BLOCKED)
        continue-on-error: true
        run: npm run check:production-readiness -w apps/api
