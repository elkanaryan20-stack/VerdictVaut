version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: verdictvaut-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-verdictvaut}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-verdictvaut}
      POSTGRES_DB: ${POSTGRES_DB:-verdictvaut}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - verdictvaut_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-verdictvaut}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  verdictvaut_postgres_data:
